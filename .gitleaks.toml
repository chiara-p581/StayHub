title = "StayHub gitleaks"

[extend]
useDefault = true

# Falsos positivos revisados a mano. Cada excepción está acotada a archivo + valor.
[[allowlists]]
description = "Clave HMAC ficticia usada como fixture en el test de firma de webhooks OTA (no es un secreto real)"
condition = "AND"
paths = ['''proyecto/src/test/java/com/stayhub/seguridad/AutenticacionWebhookOtaTest\.java''']
regexes = ['''0123456789abcdef0123456789abcdef''']
