title = "StayHub gitleaks"

[extend]
useDefault = true

# Falsos positivos revisados a mano. Cada excepción está acotada a archivo + valor.
[[allowlists]]
description = "Clave HMAC ficticia usada como fixture en el test de firma de webhooks OTA (no es un secreto real)"
condition = "AND"
paths = ['''proyecto/src/test/java/com/stayhub/seguridad/AutenticacionWebhookOtaTest\.java''']
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "Contraseña débil usada como entrada inválida que el servicio debe rechazar en el test de reseteo (no es una credencial)"
condition = "AND"
paths = ['''proyecto/src/test/java/com/stayhub/usuarios/service/ServicioDeUsuariosCoberturaTest\.java''']
regexes = ['''qwertyuiop12''']

[[allowlists]]
description = "Vector de prueba público del RFC 6238 (TOTP): Base32 de '12345678901234567890'. No es un secreto"
condition = "AND"
paths = ['''proyecto/src/test/java/com/stayhub/seguridad/MfaTotpTest\.java''']
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']
