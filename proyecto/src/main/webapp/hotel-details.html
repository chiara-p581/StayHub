<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayHub - Detalle de hotel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/theme.css?v=20260913-6" rel="stylesheet"/>
</head>
<body class="antialiased min-h-screen font-body-md text-body-md">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant transition-colors duration-200 ease-in-out docked full-width top-0 sticky z-50">
<div class="flex items-center justify-between px-md py-sm w-full max-w-container-max mx-auto">
<div class="flex items-center gap-md">
<a href="index.html" class="w-10 h-10 rounded-full bg-surface-container overflow-hidden flex items-center justify-center text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline-lg text-headline-lg text-primary flex items-center gap-sm"><span>StayHub</span><span id="brand-admin" class="hidden text-[10px] font-body-md uppercase tracking-wider bg-secondary-container px-2 py-1 rounded-full">Admin</span></h1>
</div>
<nav class="hidden md:flex items-center gap-lg">
<a class="text-on-surface-variant font-label-md hover:bg-surface-container-high px-sm py-xs rounded transition-colors" href="index.html">Home</a>
<a class="text-on-surface-variant font-label-md hover:bg-surface-container-high px-sm py-xs rounded transition-colors" href="index.html#hoteles">Otros hoteles</a>
</nav>
<a href="alerts.html" class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</a>
</div>
</header>
<main class="max-w-container-max mx-auto px-md md:px-lg py-xl">

<div id="error-banner" class="hidden mb-lg p-md rounded-DEFAULT bg-error-container text-on-error-container font-body-md text-body-md"></div>
<div id="loading" class="font-body-lg text-body-lg text-on-surface-variant">Loading hotel...</div>

<div id="contenido" class="hidden">
<!-- Header Section -->
<div class="mb-lg">
<div class="flex justify-between items-end mb-sm">
<div>
<h2 id="hotel-nombre" class="font-display-lg text-display-lg text-primary mb-xs"></h2>
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span id="hotel-direccion" class="font-body-md text-body-md"></span>
<span id="hotel-canal" class="px-2 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-semibold"></span>
</div>
</div>
</div>
</div>
<div class="w-full h-[320px] md:h-[460px] mb-xxl rounded-xl overflow-hidden bg-primary-container"><img id="hotel-imagen" src="assets/images/stayhub-resort-hero.png" alt="Vista del hotel" class="w-full h-full object-cover"/></div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-xl">
<!-- Main Content Area -->
<div class="col-span-1 md:col-span-8 flex flex-col gap-xl">
<!-- About Section -->
<section>
<h3 class="font-headline-md text-headline-md text-primary mb-md border-b-2 border-tertiary-fixed-dim/30 pb-sm inline-block">About the hotel</h3>
<div id="hotel-descripcion" class="font-body-lg text-body-lg text-on-surface-variant space-y-4 leading-relaxed"></div>
<div class="grid sm:grid-cols-2 gap-md mt-lg">
<article class="p-lg rounded-xl bg-surface-container-low border border-outline-variant/20">
<span class="material-symbols-outlined text-primary mb-sm">hotel_class</span>
<h4 class="font-title-lg text-title-lg text-primary mb-sm">The experience</h4>
<p id="hotel-experiencia" class="font-body-md text-body-md text-on-surface-variant leading-relaxed"></p>
</article>
<article class="p-lg rounded-xl bg-surface-container-low border border-outline-variant/20">
<span class="material-symbols-outlined text-primary mb-sm">explore</span>
<h4 class="font-title-lg text-title-lg text-primary mb-sm">The surroundings</h4>
<p id="hotel-entorno" class="font-body-md text-body-md text-on-surface-variant leading-relaxed"></p>
</article>
</div>
</section>
<!-- Amenities Section -->
<section>
<h3 class="font-headline-md text-headline-md text-primary mb-md border-b-2 border-tertiary-fixed-dim/30 pb-sm inline-block">Amenities</h3>
<div id="hotel-servicios" class="grid grid-cols-2 md:grid-cols-3 gap-md"></div>
</section>
</div>
<!-- Booking Sidebar -->
<div class="col-span-1 md:col-span-4 relative">
<div class="sticky top-[100px] bg-surface border border-outline-variant/50 rounded-xl p-lg shadow-[0_8px_30px_rgb(37,52,79,0.08)]">
<h3 class="font-title-lg text-title-lg text-primary mb-md">Book now</h3>

<div id="reserva-error" class="hidden mb-md p-sm rounded-DEFAULT bg-error-container text-on-error-container font-body-md text-body-md"></div>
<div id="reserva-ok" class="hidden mb-md p-sm rounded-DEFAULT bg-secondary-container text-on-secondary-container font-body-md text-body-md"></div>

<div id="reserva-form">
<div class="flex flex-col gap-xs mb-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="tipo-habitacion">Room type</label>
<select id="tipo-habitacion" class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md"></select>
</div>
<div class="grid grid-cols-2 gap-sm mb-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="check-in">Check-in</label>
<input id="check-in" type="date" class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="check-out">Checkout</label>
<input id="check-out" type="date" class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md"/>
</div>
</div>
<div class="flex flex-col gap-xs mb-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="cantidad-habitaciones">Number of rooms</label>
<input id="cantidad-habitaciones" type="number" min="1" value="1" class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md"/>
</div>
<div class="flex flex-col gap-xs mb-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="telefono">Contact phone</label>
<input id="telefono" type="tel" placeholder="+54 9 11..." class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md"/>
</div>
<div class="grid grid-cols-2 gap-sm mb-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="precio-total">Total price</label>
<input id="precio-total" type="number" step="0.01" min="0" readonly class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md bg-surface-container-low cursor-not-allowed"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="moneda">Currency</label>
<input id="moneda" type="text" value="ARS" readonly class="w-full border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md bg-surface-container-low cursor-not-allowed"/>
</div>
</div>
<p id="tarifa-hint" class="font-body-md text-body-md text-on-surface-variant mb-md"></p>

<button id="btn-reservar" disabled class="stayhub-primary-action w-full font-title-lg text-title-lg py-md rounded-lg transition-all mb-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        Add to cart
                    </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant">You will not be charged at this step.</p>
</div>
</div>
</div>
</div>
</div>
</main>

<script src="assets/js/api.js?v=20260913-6"></script>
<script>
(function () {
    var params = new URLSearchParams(location.search);
    var hotelId = params.get("hotelId");
    var canalSeleccionado = params.get("canal") || "STAYHUB";
    var loading = document.getElementById("loading");
    var contenido = document.getElementById("contenido");
    var errorBanner = document.getElementById("error-banner");
    var reservaError = document.getElementById("reserva-error");
    var reservaOk = document.getElementById("reserva-ok");
    var hotel = null;
    var tarifaValida = false;

    var usuarioActual = Api.currentUser();
    if (usuarioActual && usuarioActual.rol === "ADMIN") document.getElementById("brand-admin").classList.remove("hidden");

    var hoy = new Date();
    var hoyIso = new Date(hoy.getTime() - hoy.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    document.getElementById("check-in").min = hoyIso;
    document.getElementById("check-out").min = hoyIso;
    if (params.get("checkIn") >= hoyIso) document.getElementById("check-in").value = params.get("checkIn");
    if (params.get("checkOut") > (params.get("checkIn") || hoyIso)) document.getElementById("check-out").value = params.get("checkOut");

    function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : s;
        return d.innerHTML;
    }

    if (!hotelId) {
        loading.classList.add("hidden");
        mostrarError(errorBanner, new Error("No hotel was selected. Return home and choose one."));
        errorBanner.classList.remove("hidden");
    } else {
        Api.consultarHotel(hotelId)
            .then(function (h) {
                hotel = h;
                pintarHotel(h);
                contenido.classList.remove("hidden");
            })
            .catch(function (err) { mostrarError(errorBanner, err); })
            .finally(function () { loading.classList.add("hidden"); });
    }

    function pintarHotel(h) {
        var fotos = ["stayhub-resort-hero.png", "stayhub-patagonia.png", "stayhub-costa.png"];
        document.title = "StayHub - " + h.nombre;
        document.getElementById("hotel-nombre").textContent = h.nombre;
        document.getElementById("hotel-imagen").src = "assets/images/" + fotos[Math.abs(Number(h.id) || 0) % fotos.length];
        document.getElementById("hotel-imagen").alt = "Vista de " + h.nombre;
        document.getElementById("hotel-direccion").textContent =
            h.direccion + ", " + h.ciudad + ", " + h.pais;
        document.getElementById("hotel-canal").textContent = canalSeleccionado === "STAYHUB"
            ? "Direct booking" : "Listed on " + canalSeleccionado;

        var descripcionEl = document.getElementById("hotel-descripcion");
        descripcionEl.innerHTML = h.descripcion
            ? "<p>" + escapeHtml(h.descripcion) + "</p>"
            : '<p class="italic">This hotel does not have a description yet.</p>';
        var serviciosTexto = h.servicios && h.servicios.length
            ? h.servicios.slice(0, 3).join(", ").toLowerCase()
            : "personalized service and spaces designed for relaxation";
        document.getElementById("hotel-experiencia").textContent =
            "The experience combines " + serviciosTexto + ". Common areas and rooms are designed to make every stage of the stay comfortable, from arrival through the final breakfast.";
        document.getElementById("hotel-entorno").textContent =
            "Located in " + h.ciudad + ", it is an ideal base for exploring the area and returning to a peaceful setting. The staff can recommend transportation, activities, and nearby options during your stay.";

        var serviciosEl = document.getElementById("hotel-servicios");
        var servicios = h.servicios && h.servicios.length ? h.servicios : [];
        serviciosEl.innerHTML = servicios.length
            ? servicios.map(function (s) {
                return '<div class="stayhub-service-item flex items-center gap-sm text-on-surface-variant p-md rounded-lg transition-colors">' +
                    '<span class="material-symbols-outlined text-primary">check_circle</span>' +
                    '<span class="font-body-md text-body-md">' + escapeHtml(s) + '</span></div>';
            }).join("")
            : '<p class="italic text-on-surface-variant col-span-full">This hotel does not have any amenities listed yet.</p>';

        var select = document.getElementById("tipo-habitacion");
        var tipos = h.tiposHabitacion || [];
        select.innerHTML = tipos.length
            ? tipos.map(function (t) {
                return '<option value="' + escapeHtml(t.codigo) + '">' + escapeHtml(t.nombre) +
                    ' (up to ' + t.capacidadMaxima + ' guests)</option>';
            }).join("")
            : '<option value="">No room types have been loaded</option>';

        document.getElementById("btn-reservar").disabled = true;
        if (usuarioActual && usuarioActual.rol === "ADMIN") {
            document.getElementById("reserva-form").innerHTML = '<div class="p-lg rounded-xl bg-surface-container-low text-on-surface-variant"><span class="material-symbols-outlined text-primary mb-sm">admin_panel_settings</span><h3 class="font-title-lg text-title-lg text-primary mb-sm">Account administrativa</h3><p>Administrators can view hotels, availability, and rates, but cannot make purchases or bookings.</p></div>';
        } else if (document.getElementById("check-in").value && document.getElementById("check-out").value) {
            calcularTarifaEstimada();
        }
    }

    function calcularTarifaEstimada() {
        var checkIn = document.getElementById("check-in").value;
        var checkOut = document.getElementById("check-out").value;
        var tipo = document.getElementById("tipo-habitacion").value;
        var hint = document.getElementById("tarifa-hint");
        var btn = document.getElementById("btn-reservar");
        tarifaValida = false;
        btn.disabled = true;
        document.getElementById("precio-total").value = "";
        if (!checkIn || !checkOut || !tipo) {
            hint.textContent = "Choose dates to calculate the price.";
            return;
        }
        if (checkIn < hoyIso) {
            hint.textContent = "El check-in no puede estar en el pasado.";
            return;
        }
        if (checkOut <= checkIn) {
            hint.textContent = "El checkout debe ser posterior to check-in.";
            return;
        }

        Promise.all([
            Api.consultarTarifas(hotelId, checkIn, checkOut),
            Api.consultarDisponibilidad(hotelId, checkIn, checkOut)
        ]).then(function (resultado) {
                var tarifas = resultado[0] || [];
                var disponibilidad = resultado[1] || [];
                var delType = tarifas.filter(function (t) { return t.tipoHabitacion === tipo; });
                if (!delType.length) {
                    hint.textContent = "No rate is available for those dates. Choose another period or contact the hotel.";
                    return;
                }
                var cupo = disponibilidad.find(function (d) { return d.tipoHabitacion === tipo; });
                var cantidad = Number(document.getElementById("cantidad-habitaciones").value || 1);
                if (!cupo || Number(cupo.unidadesDisponibles) < cantidad) {
            hint.textContent = "There are not " + cantidad + " room(s) available for the entire period.";
                    return;
                }
                var total = delType.reduce(function (acc, t) { return acc + Number(t.importe); }, 0);
                total = total * cantidad;
                document.getElementById("precio-total").value = total.toFixed(2);
                document.getElementById("moneda").value = delType[0].moneda || "ARS";
                tarifaValida = true;
                btn.disabled = false;
                hint.textContent = "Available: " + cupo.unidadesDisponibles + " unit(s). Price calculated for the entire stay.";
            })
            .catch(function () {
                hint.textContent = "We could not retrieve the rate. Please try again.";
            });
    }

    document.getElementById("check-in").addEventListener("change", function () {
        var salida = document.getElementById("check-out");
        if (this.value && this.value < hoyIso) {
            this.value = "";
            salida.value = "";
            mostrarError(reservaError, new Error("No se pueden seleccionar fechas anteriores a hoy."));
            calcularTarifaEstimada();
            return;
        }
        salida.min = this.value || hoyIso;
        if (salida.value && salida.value <= this.value) salida.value = "";
    });

    document.getElementById("check-out").addEventListener("change", function () {
        var entrada = document.getElementById("check-in").value;
        if (this.value && (this.value < hoyIso || (entrada && this.value <= entrada))) {
            this.value = "";
            mostrarError(reservaError, new Error("El checkout debe ser posterior to check-in y no puede estar en el pasado."));
            calcularTarifaEstimada();
        }
    });

    ["check-in", "check-out", "tipo-habitacion", "cantidad-habitaciones"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", calcularTarifaEstimada);
    });

    document.getElementById("btn-reservar").addEventListener("click", function () {
        ocultarError(reservaError);
        reservaOk.classList.add("hidden");

        if (!Api.requireLogin()) return;

        var usuario = Api.currentUser();
        if (usuario && usuario.rol === "ADMIN") {
            mostrarError(reservaError, new Error("Las cuentas ADMIN no pueden realizar compras ni reservas."));
            return;
        }
        var tipoHabitacion = document.getElementById("tipo-habitacion").value;
        var checkIn = document.getElementById("check-in").value;
        var checkOut = document.getElementById("check-out").value;
        var cantidadHabitaciones = Number(document.getElementById("cantidad-habitaciones").value || 1);
        var telefono = document.getElementById("telefono").value.trim();
        var precioTotal = Number(document.getElementById("precio-total").value || 0);
        var moneda = document.getElementById("moneda").value.trim() || "ARS";

        if (!tipoHabitacion) { mostrarError(reservaError, new Error("Choose a room type.")); return; }
        if (!checkIn || !checkOut) { mostrarError(reservaError, new Error("Choose check-in and check-out dates.")); return; }
        if (!telefono) { mostrarError(reservaError, new Error("Enter a contact phone number.")); return; }
        if (checkIn < hoyIso) { mostrarError(reservaError, new Error("El check-in no puede estar en el pasado.")); return; }
        if (checkOut <= checkIn) { mostrarError(reservaError, new Error("El checkout debe ser posterior to check-in.")); return; }
        if (!tarifaValida || !precioTotal) { mostrarError(reservaError, new Error("No valid rate is available for this selection.")); return; }

        var btn = document.getElementById("btn-reservar");
        btn.disabled = true;
        btn.textContent = "Agregando...";

        Api.addLocalCartItem({
            hotelId: Number(hotelId), hotelNombre: hotel.nombre, tipoHabitacion: tipoHabitacion,
            canal: canalSeleccionado,
            cantidadHabitaciones: cantidadHabitaciones, checkIn: checkIn, checkOut: checkOut,
            huespedNombre: usuario.nombre, huespedApellido: usuario.apellido, huespedEmail: usuario.email,
            huespedTelefono: telefono, precioTotal: precioTotal, moneda: moneda
        });
        location.href = "cart.html";
    });
})();
</script>
</body></html>
