<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayHub - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/theme.css?v=20260911-5" rel="stylesheet"/>
</head>
<body class="h-full bg-background flex flex-col">
<!-- Transactional Screen - No Navigation Shell -->
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-[480px]">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">StayHub</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Contemporary Boutique Hospitality</p>
</div>
<!-- Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg border-t-2 border-tertiary-fixed-dim/30 p-xl relative overflow-hidden">
<!-- Subtle background accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-tertiary-fixed-dim/50 to-transparent"></div>
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-primary mb-sm">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Enter the email address associated with your StayHub account. We will send you a secure link to reset your password.
                    </p>
</div>
<div id="aviso-pendiente" class="hidden mb-md p-md rounded-DEFAULT bg-tertiary-fixed/40 text-on-tertiary-fixed-variant font-body-md text-body-md"></div>
<form id="recover-form" class="space-y-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="block w-full pl-[48px] pr-md py-sm bg-surface-container-lowest border-outline-variant rounded-DEFAULT focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="manager@boutiquehotel.com" required type="email"/>
</div>
</div>
<div class="pt-sm">
<button id="submit-btn" class="w-full flex justify-center py-[16px] px-md border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                            Send Reset Link
                        </button>
</div>
</form>
</div>
<!-- Back to Login -->
<div class="mt-lg text-center">
<a class="inline-flex items-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="login.html">
<span class="material-symbols-outlined text-[16px] mr-xs" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>

<script>
(function () {
    var form = document.getElementById("recover-form");
    var aviso = document.getElementById("aviso-pendiente");
    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        // ServicioDeUsuarios todavía no expone un endpoint para recuperar
        // contraseña (solo registrar / login / consultar por id). Lo dejamos
        // visible y honesto en vez de simular un envío que no pasa nada.
        aviso.textContent = "Esta función todavía no está implementada en el backend (falta un endpoint de recuperación de contraseña en ServicioDeUsuarios). Por ahora, pedile a un administrador que verifique tu cuenta.";
        aviso.classList.remove("hidden");
        document.getElementById("submit-btn").disabled = true;
    });
})();
</script>
<script src="assets/js/api.js?v=20260911-5"></script>
</body></html>
