<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/theme.css" rel="stylesheet"/>

        .input-transition {
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

<body class="bg-background min-h-screen flex items-center justify-center relative font-body-md text-on-surface antialiased overflow-hidden">
<!-- Ambient Background Image -->
<div class="absolute inset-0 z-0 opacity-40 mix-blend-multiply" data-alt="A wide, slightly blurred background image of an elegant, modern boutique hotel lobby. The space features warm, ambient lighting, natural wood textures, and plush cream seating areas. A subtle, sophisticated light-mode aesthetic dominates, with soft shadows and a sense of calm luxury. High-end architectural details like a marble reception desk and minimalist brass fixtures are visible in the soft-focus distance, creating a welcoming and premium atmosphere suitable for a hospitality software interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuALfjs3rHjXznRlfeTEC0a6zkrzrfaVkUhZKt0sTX4DR6Bj1cdWYugh6C5zo2SUQYeELe91ILcmFFw8Qk3a0Xa7DI3bhoWFmpnc3l8tZOxpkoUKkkIt4lOrpOuO_JvYbRXzZ3ODbmh71acD-oQzs6Mj1OF3_HRdu0pMsyXDSGX3t3F95z4TvwG_MA2Yy4Gpbe710944iQ5-A6nl8CCXuUjpSXABUy60J-xbEt16kyPI2IPhvR1BhcyLrQ')">
</div>
<!-- Optional gradient overlay to ensure legibility -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-background/80 to-surface-variant/50"></div>
<!-- Main Registration Card -->
<main class="relative z-10 w-full max-w-[480px] mx-md md:mx-auto">
<!-- Card Container with Warm Tan Background -->
<div class="bg-tertiary-fixed rounded-xl shadow-[0_12px_40px_rgba(37,52,79,0.12)] border border-tertiary-fixed-dim/30 overflow-hidden flex flex-col p-xl">
<!-- Header Section -->
<div class="flex flex-col items-center justify-center mb-xl text-center">
<!-- Decorative Icon acting as Brand Mark -->
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">StayHub</h1>
<p class="font-body-md text-body-md text-on-tertiary-fixed-variant max-w-[280px]">
                    Join us to experience sophisticated property management.
                </p>
</div>
<!-- Registration Form -->
<div id="error-banner" class="hidden mb-sm p-md rounded-DEFAULT bg-error-container text-on-error-container font-body-md text-body-md"></div>
<form id="register-form" class="flex flex-col gap-lg">
<!-- Nombre + Apellido -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="nombre">Nombre</label>
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary px-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="nombre" name="nombre" placeholder="Jane" required type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="apellido">Apellido</label>
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary px-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="apellido" name="apellido" placeholder="Doe" required type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">verified_user</span>
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required type="password"/>
</div>
</div>
<!-- Tipo de cuenta -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-tertiary-fixed" for="rol">Tipo de cuenta</label>
<select class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary px-md py-[12px] font-body-md text-body-md text-on-surface rounded-t-DEFAULT focus:outline-none input-transition shadow-sm" id="rol" name="rol">
<option value="HUESPED">Huésped</option>
</select>
</div>
<!-- Action Button -->
<button id="submit-btn" class="mt-sm bg-primary text-on-primary font-label-md text-label-md py-[16px] px-lg rounded-DEFAULT w-full flex items-center justify-center hover:bg-on-primary-fixed hover:shadow-md transition-all duration-200 active:scale-[0.98]" type="submit">
                    Create Account
                    <span class="material-symbols-outlined ml-sm text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Footer / Navigation -->
<div class="mt-xl text-center border-t border-tertiary-fixed-dim/40 pt-md">
<p class="font-body-md text-body-md text-on-tertiary-fixed-variant">
                    Already have an account?
                    <a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed underline transition-colors ml-xs" href="login.html">
                        Back to Login
                    </a>
</p>
</div>
</div>

</main>

<script src="assets/js/api.js?v=20260911-4"></script>
<script>
(function () {
    var form = document.getElementById("register-form");
    var errorBanner = document.getElementById("error-banner");
    var submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        ocultarError(errorBanner);

        var nombre = document.getElementById("nombre").value.trim();
        var apellido = document.getElementById("apellido").value.trim();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;
        var rol = document.getElementById("rol").value;

        if (password !== confirmPassword) {
            mostrarError(errorBanner, new Error("Las contraseñas no coinciden."));
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creando cuenta...";

        Api.registrarUsuario({ email: email, password: password, nombre: nombre, apellido: apellido, rol: rol })
            .then(function () {
                // Auto-login: ya tenemos el email/contraseña recién creados.
                return Api.loginUsuario({ email: email, password: password });
            })
            .then(function (usuario) {
                Api.setSession(usuario);
                submitBtn.textContent = "¡Cuenta creada!";
                setTimeout(function () {
                    location.href = rol === "ADMIN" ? "admin-dashboard.html" : "index.html";
                }, 800);
            })
            .catch(function (err) {
                mostrarError(errorBanner, err);
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            });
    });
})();
</script>
</body></html>
