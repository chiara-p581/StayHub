<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>StayHub - Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="assets/js/tailwind-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/><link href="assets/css/theme.css?v=20260913-6" rel="stylesheet"/></head>
<body class="bg-background text-on-background font-body-md min-h-screen"><main class="max-w-6xl mx-auto px-md py-xxl"><div class="mb-xl"><p class="text-sm uppercase tracking-wider text-on-surface-variant">Your upcoming stays</p><h1 class="font-headline-lg text-headline-lg text-primary">Cart</h1><p class="text-on-surface-variant mt-xs">The entire cart is paid in one transaction.</p></div><div id="error-banner" class="hidden mb-lg p-md rounded-lg bg-error-container text-on-error-container"></div><div id="admin-bloqueo" class="hidden p-xl rounded-xl bg-surface border border-outline-variant/30"><h2 class="font-title-lg text-title-lg text-primary">Admin account</h2><p class="mt-sm text-on-surface-variant">Administrators cannot purchase or confirm bookings.</p></div><div id="vacio" class="hidden bg-white rounded-xl border border-outline-variant/20 p-xl text-center"><span class="material-symbols-outlined text-5xl text-on-surface-variant">shopping_bag</span><h2 class="font-title-lg text-title-lg mt-md">Your cart is empty</h2><a href="index.html#hoteles" class="stayhub-primary-action inline-flex mt-lg px-lg py-sm rounded-full">Explore hotels</a></div><div id="contenido" class="grid lg:grid-cols-[1fr_330px] gap-xl items-start"><section id="items" class="space-y-lg"></section><aside class="bg-white rounded-xl border border-outline-variant/20 p-xl sticky top-24"><h2 class="font-title-lg text-title-lg">Summary</h2><div class="flex justify-between mt-lg"><span>Stays</span><strong id="cantidad"></strong></div><div class="flex justify-between mt-sm"><span>Total</span><strong id="total" class="text-primary"></strong></div><p class="text-sm text-on-surface-variant mt-md">Availability and prices will be validated before payment.</p><button id="ir-pagar" class="stayhub-primary-action w-full mt-xl py-md rounded-full font-semibold">Proceed to payment</button><button id="vaciar" class="w-full mt-sm py-sm text-error">Clear cart</button></aside></div></main>
<script src="assets/js/api.js?v=20260913-6"></script><script>
(function(){if(!Api.requireLogin())return;var usuario=Api.currentUser(),fotos=['stayhub-resort-hero.png','stayhub-patagonia.png','stayhub-costa.png'];if(usuario.rol==='ADMIN'){document.getElementById('contenido').classList.add('hidden');document.getElementById('admin-bloqueo').classList.remove('hidden');return}function dinero(n,m){return new Intl.NumberFormat('en-US',{style:'currency',currency:m||'ARS'}).format(Number(n)||0)}function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}function pintar(){var items=Api.localCart(),cont=document.getElementById('contenido'),vacio=document.getElementById('vacio'),lista=document.getElementById('items');cont.classList.toggle('hidden',!items.length);vacio.classList.toggle('hidden',!!items.length);lista.innerHTML='';document.getElementById('cantidad').textContent=items.length;document.getElementById('total').textContent=dinero(items.reduce(function(a,i){return a+Number(i.precioTotal||0)},0),'ARS');items.forEach(function(item){var art=document.createElement('article'),foto=fotos[Math.abs(Number(item.hotelId)||0)%fotos.length];art.className='bg-white rounded-xl border border-outline-variant/20 overflow-hidden grid sm:grid-cols-[220px_1fr]';art.innerHTML='<img src="assets/images/'+foto+'" alt="'+esc(item.hotelNombre)+'" class="w-full h-full min-h-48 object-cover"><div class="p-lg"><div class="flex justify-between gap-md"><div><p class="text-xs uppercase tracking-wider text-on-surface-variant">'+(item.reservaId?'Booking prepared #'+item.reservaId:'It will be confirmed when you continue')+'</p><h2 class="font-headline-md text-headline-md text-primary mt-xs">'+esc(item.hotelNombre)+'</h2><p class="text-sm text-on-surface-variant mt-xs">'+esc(item.canal||'STAYHUB')+'</p></div><button class="eliminar text-error" aria-label="Remove from cart"><span class="material-symbols-outlined">delete</span></button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-md mt-lg text-sm"><div><span class="block text-on-surface-variant">Check-in</span><b>'+item.checkIn+'</b></div><div><span class="block text-on-surface-variant">Check-out</span><b>'+item.checkOut+'</b></div><div><span class="block text-on-surface-variant">Room</span><b>'+esc(item.tipoHabitacion)+' × '+item.cantidadHabitaciones+'</b></div><div><span class="block text-on-surface-variant">Subtotal</span><b>'+dinero(item.precioTotal,item.moneda)+'</b></div></div></div>';art.querySelector('.eliminar').onclick=function(){Api.removeLocalCartItem(item.itemId);pintar()};lista.appendChild(art)})}document.getElementById('vaciar').onclick=function(){Api.clearLocalCart();pintar()};document.getElementById('ir-pagar').onclick=async function(){var btn=this;btn.disabled=true;btn.textContent='Preparing checkout…';try{var items=Api.localCart();for(var i=0;i<items.length;i++){if(items[i].reservaId)continue;var r=await Api.crearReserva(items[i]);Api.updateLocalCartItem(items[i].itemId,{reservaId:r.id,precioTotal:r.precioTotal,moneda:r.moneda})}location.href='checkout.html'}catch(e){mostrarError(document.getElementById('error-banner'),e);btn.disabled=false;btn.textContent='Proceed to payment'}};pintar()})();
</script></body></html>
