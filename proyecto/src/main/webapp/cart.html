<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StayHub - Carrito</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/><link href="assets/css/theme.css?v=20260911-5" rel="stylesheet"/></head>
<body class="bg-background text-on-background font-body-md min-h-screen"><main class="max-w-5xl mx-auto px-md py-xxl">
<div class="mb-xl"><p class="text-sm uppercase tracking-wider text-on-surface-variant">Tu estadía</p><h1 class="font-headline-lg text-headline-lg text-primary">Carrito de reserva</h1></div>
<div id="error-banner" class="hidden mb-lg p-md rounded-lg bg-error-container text-on-error-container"></div>
<div id="loading" class="p-xl bg-white rounded-xl border border-outline-variant/20">Recuperando tu selección…</div>
<div id="vacio" class="hidden bg-white rounded-xl border border-outline-variant/20 p-xl text-center"><span class="material-symbols-outlined text-5xl text-on-surface-variant">shopping_bag</span><h2 class="font-title-lg text-title-lg mt-md">Tu carrito está vacío</h2><a href="index.html#hoteles" class="inline-flex mt-lg px-lg py-sm rounded-full bg-primary text-on-primary">Explorar hoteles</a></div>
<div id="contenido" class="hidden grid lg:grid-cols-[1fr_340px] gap-xl">
 <section class="bg-white rounded-xl border border-outline-variant/20 overflow-hidden"><img src="assets/images/stayhub-resort-hero.png" alt="Hotel seleccionado" class="w-full h-64 object-cover"/><div class="p-xl"><h2 id="hotel-nombre" class="font-headline-md text-headline-md text-primary"></h2><p id="hotel-ubicacion" class="text-on-surface-variant mt-xs"></p><dl class="grid grid-cols-2 gap-md mt-xl"><div><dt class="text-sm text-on-surface-variant">Entrada</dt><dd id="checkin" class="font-semibold"></dd></div><div><dt class="text-sm text-on-surface-variant">Salida</dt><dd id="checkout" class="font-semibold"></dd></div><div><dt class="text-sm text-on-surface-variant">Habitación</dt><dd id="tipo" class="font-semibold"></dd></div><div><dt class="text-sm text-on-surface-variant">Cantidad</dt><dd id="cantidad" class="font-semibold"></dd></div></dl></div></section>
 <aside class="bg-white rounded-xl border border-outline-variant/20 p-xl h-fit"><h2 class="font-title-lg text-title-lg">Resumen</h2><div class="flex justify-between mt-lg"><span>Total estimado</span><strong id="total" class="text-primary"></strong></div><p class="text-sm text-on-surface-variant mt-sm">La disponibilidad y el precio se verifican nuevamente al confirmar.</p><button id="confirmar" class="w-full mt-xl py-md rounded-full bg-primary text-on-primary font-semibold">Confirmar reserva</button><button id="vaciar" class="w-full mt-sm py-sm text-error">Vaciar carrito</button></aside>
</div></main><script src="assets/js/api.js?v=20260911-5"></script><script>(function(){if(!Api.requireLogin())return;var carrito=null,hotel=null,error=document.getElementById('error-banner');Promise.resolve(Api.carritoResumen()).then(function(c){carrito=c;if(!c||!c.hotelId){document.getElementById('loading').classList.add('hidden');document.getElementById('vacio').classList.remove('hidden');return null}return Api.consultarHotel(c.hotelId)}).then(function(h){if(!h)return;hotel=h;document.getElementById('loading').classList.add('hidden');document.getElementById('contenido').classList.remove('hidden');document.getElementById('hotel-nombre').textContent=h.nombre;document.getElementById('hotel-ubicacion').textContent=h.ciudad+', '+h.pais;document.getElementById('checkin').textContent=carrito.checkIn;document.getElementById('checkout').textContent=carrito.checkOut;document.getElementById('tipo').textContent=carrito.tipoHabitacion;document.getElementById('cantidad').textContent=carrito.cantidadHabitaciones;document.getElementById('total').textContent=new Intl.NumberFormat('es-AR',{style:'currency',currency:carrito.moneda||'ARS'}).format(carrito.precioTotal||0)}).catch(function(e){document.getElementById('loading').classList.add('hidden');mostrarError(error,e)});document.getElementById('confirmar').onclick=function(){var b=this;b.disabled=true;b.textContent='Confirmando…';Api.carritoConfirmar().then(function(r){location.href='payments.html?reservaId='+r.id+'&monto='+r.precioTotal+'&moneda='+r.moneda}).catch(function(e){mostrarError(error,e);b.disabled=false;b.textContent='Confirmar reserva'})};document.getElementById('vaciar').onclick=function(){Api.carritoVaciar().then(function(){location.reload()}).catch(function(e){mostrarError(error,e)})}})();</script></body></html>
