<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>StayHub - Mi cuenta</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="assets/js/tailwind-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/><link href="assets/css/theme.css?v=20260912-8" rel="stylesheet"/></head>
<body class="bg-background text-on-background font-body-md min-h-screen"><main class="max-w-5xl mx-auto px-md py-xxl"><div class="mb-xl"><p class="text-xs uppercase tracking-wider text-on-surface-variant">Perfil</p><h1 class="font-headline-lg text-headline-lg text-primary">Mi cuenta</h1><p class="text-on-surface-variant">Administrá tus datos y consultá el historial de tus estadías.</p></div><div id="error-banner" class="hidden mb-md p-md rounded-lg bg-error-container text-on-error-container"></div><div id="success-banner" class="hidden mb-md p-md rounded-lg bg-secondary-container text-on-secondary-container"></div>
<div class="grid lg:grid-cols-[320px_1fr] gap-lg items-start"><aside class="bg-white rounded-2xl border border-outline-variant/30 p-xl text-center"><div id="perfil-avatar" class="w-20 h-20 mx-auto rounded-full bg-secondary-container flex items-center justify-center text-2xl font-bold text-primary"></div><h2 id="perfil-nombre" class="font-title-lg text-title-lg mt-md"></h2><p id="perfil-email" class="text-sm text-on-surface-variant break-all"></p><span id="perfil-rol" class="inline-flex mt-sm rounded-full bg-surface-container-high px-sm py-xs text-xs uppercase"></span><button id="btn-logout" class="mt-xl w-full border border-error text-error rounded-full py-sm">Cerrar sesión</button></aside><div class="space-y-lg">
<section class="bg-white rounded-2xl border border-outline-variant/30 p-xl"><div class="flex items-center gap-sm mb-lg"><span class="material-symbols-outlined text-primary">manage_accounts</span><h2 class="font-title-lg text-title-lg">Información personal</h2></div><form id="perfil-form" class="grid sm:grid-cols-2 gap-md"><label class="text-sm">Nombre<input id="nombre" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="text-sm">Apellido<input id="apellido" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="sm:col-span-2 text-sm">Email<input id="email" type="email" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="sm:col-span-2 text-sm">Nueva contraseña <span class="text-on-surface-variant">(opcional)</span><input id="password" type="password" minlength="6" autocomplete="new-password" class="mt-xs w-full rounded-lg border-outline-variant" placeholder="Dejala vacía para conservar la actual"/></label><button id="guardar" class="sm:col-span-2 rounded-full bg-primary text-on-primary py-md font-semibold">Guardar cambios</button></form></section>
<section id="mis-reservas" class="bg-white rounded-2xl border border-outline-variant/30 p-xl scroll-mt-24"><div class="flex items-center gap-sm"><span class="material-symbols-outlined text-primary">luggage</span><h2 class="font-title-lg text-title-lg">Mis reservas</h2></div><p class="text-sm text-on-surface-variant mt-xs">Tus próximas estadías y tu historial.</p><div id="reservas-lista" class="mt-lg divide-y divide-outline-variant/30"><p class="py-lg text-on-surface-variant">Cargando reservas…</p></div></section></div></div></main>
<script src="assets/js/api.js?v=20260912-8"></script><script>
(function(){if(!Api.requireLogin())return;var usuario=Api.currentUser(),error=document.getElementById('error-banner'),ok=document.getElementById('success-banner');function pintar(u){usuario=u;document.getElementById('perfil-avatar').textContent=(u.nombre.charAt(0)+u.apellido.charAt(0)).toUpperCase();document.getElementById('perfil-nombre').textContent=u.nombre+' '+u.apellido;document.getElementById('perfil-email').textContent=u.email;document.getElementById('perfil-rol').textContent=u.rol;document.getElementById('nombre').value=u.nombre;document.getElementById('apellido').value=u.apellido;document.getElementById('email').value=u.email}pintar(usuario);Api.consultarUsuario(usuario.id).then(function(u){Api.setSession(u);pintar(u)}).catch(function(e){mostrarError(error,e)});document.getElementById('perfil-form').onsubmit=function(e){e.preventDefault();var b=document.getElementById('guardar');b.disabled=true;b.textContent='Guardando…';Api.actualizarMiPerfil({nombre:document.getElementById('nombre').value.trim(),apellido:document.getElementById('apellido').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}).then(function(u){Api.setSession(u);pintar(u);document.getElementById('password').value='';ok.textContent='Tu información se actualizó correctamente.';ok.classList.remove('hidden');error.classList.add('hidden')}).catch(function(e){mostrarError(error,e)}).finally(function(){b.disabled=false;b.textContent='Guardar cambios'})};function categoria(r){var hoy=new Date();hoy.setHours(0,0,0,0);var desde=new Date(r.checkIn+'T00:00:00'),hasta=new Date(r.checkOut+'T00:00:00');if(r.estado==='CANCELADA'||r.estado==='RECHAZADA')return[r.estado,'bg-error-container text-on-error-container'];if(hoy<desde)return['Próximamente','bg-secondary-container text-on-secondary-container'];if(hoy>=desde&&hoy<hasta)return['Activa','bg-primary text-on-primary'];return['Ya pasó','bg-surface-container-high text-on-surface-variant']}Api.listarMisReservas().then(function(rs){var c=document.getElementById('reservas-lista');if(!rs.length){c.innerHTML='<p class="py-lg text-on-surface-variant">Todavía no tenés reservas.</p>';return}c.innerHTML=rs.map(function(r){var t=categoria(r);return'<a href="reservation-details.html?reservaId='+r.id+'" class="flex items-center justify-between gap-md py-md hover:bg-surface-container-low px-sm rounded-lg"><div><b class="text-primary">Reserva #'+r.id+'</b><p class="text-sm text-on-surface-variant">'+r.checkIn+' al '+r.checkOut+' · '+(r.canal==='DIRECTA'?'StayHub':r.canal)+'</p></div><span class="rounded-full px-sm py-xs text-xs font-semibold '+t[1]+'">'+t[0]+'</span></a>'}).join('')}).catch(function(e){document.getElementById('reservas-lista').innerHTML='<p class="py-lg text-error">'+e.message+'</p>'});document.getElementById('btn-logout').onclick=function(){Api.clearSession();location.href='index.html'}})();
</script></body></html>
