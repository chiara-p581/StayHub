<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>StayHub - Mi cuenta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="assets/js/tailwind-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/><link href="assets/css/theme.css?v=20260912-9" rel="stylesheet"/></head>
<body class="bg-background text-on-background font-body-md min-h-screen"><main class="max-w-6xl mx-auto px-md py-xl"><div class="mb-xl"><p class="text-xs uppercase tracking-wider text-on-surface-variant">Cuenta</p><h1 class="font-headline-lg text-headline-lg text-primary">Mi cuenta</h1><p class="text-on-surface-variant">Administrá tu perfil, tus reservas y tus pagos.</p></div><div id="error-banner" class="hidden mb-md p-md rounded-lg bg-error-container text-on-error-container"></div><div id="success-banner" class="hidden mb-md p-md rounded-lg bg-secondary-container text-on-secondary-container"></div>
<div class="grid lg:grid-cols-[270px_1fr] gap-lg items-start"><aside class="space-y-md lg:sticky lg:top-24"><section class="bg-white rounded-2xl border border-outline-variant/30 p-lg text-center"><div id="perfil-avatar" class="w-16 h-16 mx-auto rounded-full bg-secondary-container flex items-center justify-center text-xl font-bold text-primary"></div><h2 id="perfil-nombre" class="font-title-lg text-title-lg mt-sm"></h2><p id="perfil-email" class="text-xs text-on-surface-variant break-all"></p><span id="perfil-rol" class="inline-flex mt-sm rounded-full bg-surface-container-high px-sm py-xs text-xs uppercase"></span><button id="abrir-edicion" class="flex items-center justify-center gap-xs mt-md w-full rounded-full border border-primary text-primary py-sm"><span class="material-symbols-outlined text-lg">edit</span>Editar perfil</button></section>
<nav class="bg-white rounded-2xl border border-outline-variant/30 p-sm" aria-label="Secciones de mi cuenta"><button data-panel="reservas-panel" class="cuenta-nav active"><span class="material-symbols-outlined">luggage</span>Mis reservas</button><button data-panel="pagos-panel" class="cuenta-nav"><span class="material-symbols-outlined">receipt_long</span>Mis pagos</button></nav><button id="btn-logout" class="w-full border border-error text-error rounded-full py-sm">Cerrar sesión</button></aside>
<div><section id="edicion-panel" class="hidden bg-white rounded-2xl border border-outline-variant/30 p-xl mb-lg"><div class="flex justify-between items-center mb-lg"><h2 class="font-title-lg text-title-lg">Editar información personal</h2><button id="cerrar-edicion" class="p-xs" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></div><form id="perfil-form" class="grid sm:grid-cols-2 gap-md"><label class="text-sm">Nombre<input id="nombre" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="text-sm">Apellido<input id="apellido" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="sm:col-span-2 text-sm">Email<input id="email" type="email" class="mt-xs w-full rounded-lg border-outline-variant" required/></label><label class="sm:col-span-2 text-sm">Nueva contraseña <span class="text-on-surface-variant">(opcional)</span><input id="password" type="password" minlength="6" autocomplete="new-password" class="mt-xs w-full rounded-lg border-outline-variant" placeholder="Dejala vacía para conservar la actual"/></label><button id="guardar" class="sm:col-span-2 rounded-full bg-primary text-on-primary py-md font-semibold">Guardar cambios</button></form></section>
<section id="reservas-panel" class="cuenta-panel bg-white rounded-2xl border border-outline-variant/30 p-xl"><div class="flex items-center gap-sm"><span class="material-symbols-outlined text-primary">luggage</span><h2 class="font-title-lg text-title-lg">Mis reservas</h2></div><p class="text-sm text-on-surface-variant mt-xs">Próximas estadías e historial completo.</p><div id="reservas-lista" class="mt-lg divide-y divide-outline-variant/30"><p class="py-lg text-on-surface-variant">Cargando reservas…</p></div></section>
<section id="pagos-panel" class="cuenta-panel hidden bg-white rounded-2xl border border-outline-variant/30 p-xl"><div class="flex items-center gap-sm"><span class="material-symbols-outlined text-primary">receipt_long</span><h2 class="font-title-lg text-title-lg">Mis pagos</h2></div><p class="text-sm text-on-surface-variant mt-xs">Comprobantes asociados a tus reservas.</p><div id="pagos-lista" class="mt-lg divide-y divide-outline-variant/30"><p class="py-lg text-on-surface-variant">Cargando pagos…</p></div></section></div></div></main>
<style>.cuenta-nav{display:flex;width:100%;align-items:center;gap:.7rem;padding:.75rem;border-radius:.75rem;color:#596273;text-align:left}.cuenta-nav:hover{background:#f0f2f5}.cuenta-nav.active{background:#182944;color:#fff}</style><script src="assets/js/api.js?v=20260912-9"></script><script>
(function(){if(!Api.requireLogin())return;var usuario=Api.currentUser(),error=document.getElementById('error-banner'),ok=document.getElementById('success-banner'),nombre=document.getElementById('nombre'),apellido=document.getElementById('apellido'),email=document.getElementById('email'),password=document.getElementById('password');function pintar(u){usuario=u;document.getElementById('perfil-avatar').textContent=(u.nombre.charAt(0)+u.apellido.charAt(0)).toUpperCase();document.getElementById('perfil-nombre').textContent=u.nombre+' '+u.apellido;document.getElementById('perfil-email').textContent=u.email;document.getElementById('perfil-rol').textContent=u.rol;document.getElementById('nombre').value=u.nombre;document.getElementById('apellido').value=u.apellido;document.getElementById('email').value=u.email}pintar(usuario);Api.consultarUsuario(usuario.id).then(function(u){Api.setSession(u);pintar(u)}).catch(function(e){mostrarError(error,e)});document.querySelectorAll('.cuenta-nav').forEach(function(b){b.onclick=function(){document.querySelectorAll('.cuenta-nav').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.cuenta-panel').forEach(function(x){x.classList.add('hidden')});b.classList.add('active');document.getElementById(b.dataset.panel).classList.remove('hidden')}});document.getElementById('abrir-edicion').onclick=function(){document.getElementById('edicion-panel').classList.remove('hidden');document.getElementById('edicion-panel').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('cerrar-edicion').onclick=function(){document.getElementById('edicion-panel').classList.add('hidden')};document.getElementById('perfil-form').onsubmit=function(e){e.preventDefault();var b=document.getElementById('guardar');b.disabled=true;b.textContent='Guardando…';Api.actualizarMiPerfil({nombre:nombre.value.trim(),apellido:apellido.value.trim(),email:email.value.trim(),password:password.value}).then(function(u){Api.setSession(u);pintar(u);password.value='';document.getElementById('edicion-panel').classList.add('hidden');ok.textContent='Tu perfil se actualizó correctamente.';ok.classList.remove('hidden')}).catch(function(e){mostrarError(error,e)}).finally(function(){b.disabled=false;b.textContent='Guardar cambios'})};function tag(r){var h=new Date();h.setHours(0,0,0,0);var d=new Date(r.checkIn+'T00:00:00'),f=new Date(r.checkOut+'T00:00:00');if(r.estado==='CANCELADA'||r.estado==='RECHAZADA')return[r.estado,'bg-error-container text-on-error-container'];if(h<d)return['Próximamente','bg-secondary-container text-on-secondary-container'];if(h>=d&&h<f)return['Activa','bg-primary text-on-primary'];return['Ya pasó','bg-surface-container-high text-on-surface-variant']}Api.listarMisReservas().then(function(rs){var c=document.getElementById('reservas-lista');c.innerHTML=rs.length?rs.map(function(r){var t=tag(r);return'<div class="flex items-center justify-between gap-md py-md"><div><b class="text-primary">Reserva #'+r.id+'</b><p class="text-sm text-on-surface-variant">'+r.checkIn+' al '+r.checkOut+' · '+(r.canal==='DIRECTA'?'StayHub':r.canal)+'</p><a class="inline-flex mt-xs text-sm text-primary underline" href="reservation-details.html?reservaId='+r.id+'">Ver detalles</a></div><span class="rounded-full px-sm py-xs text-xs font-semibold '+t[1]+'">'+t[0]+'</span></div>'}).join(''):'<p class="py-lg text-on-surface-variant">Todavía no tenés reservas.</p>'}).catch(function(e){document.getElementById('reservas-lista').innerHTML='<p class="py-lg text-error">'+e.message+'</p>'});Api.listarMisPagos().then(function(ps){var c=document.getElementById('pagos-lista');c.innerHTML=ps.length?ps.map(function(p){return'<div class="flex items-center justify-between gap-md py-md"><div><b>Pago #'+p.id+'</b><p class="text-sm text-on-surface-variant">Reservas '+(p.reservaIds||[p.reservaId]).map(function(x){return'#'+x}).join(', ')+' · '+new Date(p.fechaPago).toLocaleString('es-AR')+'</p></div><div class="text-right"><b>'+new Intl.NumberFormat('es-AR',{style:'currency',currency:p.moneda||'ARS'}).format(p.monto)+'</b><span class="block text-xs text-primary">'+p.estado+'</span></div></div>'}).join(''):'<p class="py-lg text-on-surface-variant">Todavía no tenés pagos.</p>'}).catch(function(e){document.getElementById('pagos-lista').innerHTML='<p class="py-lg text-error">'+e.message+'</p>'});document.getElementById('btn-logout').onclick=function(){Api.clearSession();location.href='index.html'}})();
</script></body></html>
