<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayHub - Restablecer contraseña</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/theme.css?v=20260913-6" rel="stylesheet"/>
</head>
<body class="stayhub-auth-page h-full bg-background flex flex-col">
<!-- Transactional Screen - No Navigation Shell -->
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-[480px]">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">StayHub</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Contemporary Boutique Hospitality</p>
</div>
<!-- Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg border-t-2 border-tertiary-fixed-dim/30 p-xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-tertiary-fixed-dim/50 to-transparent"></div>
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-primary mb-sm">Restablecer contraseña</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Elegí una nueva contraseña de al menos 6 caracteres.
                    </p>
</div>
<div id="aviso-pendiente" class="hidden mb-md p-md rounded-DEFAULT bg-tertiary-fixed/40 text-on-tertiary-fixed-variant font-body-md text-body-md"></div>
<form id="reset-form" class="space-y-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Nueva contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-[48px] pr-md py-sm bg-surface-container-lowest border-outline-variant rounded-DEFAULT focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface" id="password" type="password" required minlength="6" maxlength="200" autocomplete="new-password" placeholder="Nueva contraseña"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirm-password">Repetir contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-[48px] pr-md py-sm bg-surface-container-lowest border-outline-variant rounded-DEFAULT focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface" id="confirm-password" type="password" required minlength="6" maxlength="200" autocomplete="new-password" placeholder="Repetí la contraseña"/>
</div>
</div>
<div class="pt-sm">
<button id="submit-btn" class="w-full flex justify-center py-[16px] px-md border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                            Guardar contraseña
                        </button>
</div>
</form>
</div>
<!-- Back to Login -->
<div class="mt-lg text-center">
<a class="inline-flex items-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="login.html">
<span class="material-symbols-outlined text-[16px] mr-xs" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>

<script>
(function () {
    // El token viene después del # en el link del mail: así nunca llega a los logs del servidor
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get("token");
    history.replaceState(null, "", location.pathname); // lo saca de la barra de direcciones

    const form = document.getElementById("reset-form");
    const aviso = document.getElementById("aviso-pendiente");
    const btn = document.getElementById("submit-btn");

    if (!token) {
        aviso.textContent = "Falta el token. Solicitá un nuevo enlace de recuperación.";
        aviso.classList.remove("hidden");
        btn.disabled = true;
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        aviso.classList.remove("hidden");
        const password = document.getElementById("password").value;
        if (password !== document.getElementById("confirm-password").value) {
            aviso.textContent = "Las contraseñas no coinciden.";
            return;
        }
        btn.disabled = true;
        try {
            const r = await fetch("api/usuarios/resetear-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, nuevaPassword: password })
            });
            if (!r.ok) throw new Error("El enlace es inválido o expiró, o la contraseña no es válida.");
            form.reset();
            aviso.textContent = "Contraseña actualizada. Volvé al inicio de sesión.";
        } catch (err) {
            aviso.textContent = err.message;
            btn.disabled = false;
        }
    });
})();
</script>
<script src="assets/js/api.js?v=20260913-6"></script>
</body></html>
