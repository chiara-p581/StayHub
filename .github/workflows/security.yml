name: StayHub CI

on:
  push:
    branches: [development, main]
    tags: ["v*-testing"]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: stayhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar, ejecutar pruebas, verificar cobertura (JaCoCo), mutation score (PIT) y generar WAR/SBOM
        run: mvn --file proyecto/pom.xml --batch-mode --no-transfer-progress clean verify
      - name: Resumen de cobertura de la capa de negocio
        if: always()
        run: |
          csv=proyecto/target/site/jacoco/jacoco.csv
          test -f "$csv" || { echo "Sin reporte JaCoCo" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$csv" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, re, sys
          rows = [r for r in csv.DictReader(open(sys.argv[1]))
                  if re.match(r'com\.stayhub\.[^.]+\.(service|model)(\.|$)', r['PACKAGE'])
                  or r['PACKAGE'] == 'com.stayhub.reservas.carrito']
          def pct(c, m): return 100 * c / (c + m) if c + m else 100
          lc = sum(int(r['LINE_COVERED']) for r in rows); lm = sum(int(r['LINE_MISSED']) for r in rows)
          bc = sum(int(r['BRANCH_COVERED']) for r in rows); bm = sum(int(r['BRANCH_MISSED']) for r in rows)
          print('### Cobertura JaCoCo, capa de negocio (service, model, carrito)')
          print('| Métrica | Cobertura | Umbral |')
          print('|---|---|---|')
          print(f'| Líneas | {pct(lc, lm):.1f}% ({lc}/{lc + lm}) | 80% |')
          print(f'| Ramas | {pct(bc, bm):.1f}% ({bc}/{bc + bm}) | 70% |')
          PY
      - name: Resumen de mutation testing (PIT)
        if: always()
        run: |
          xml=proyecto/target/pit-reports/mutations.xml
          test -f "$xml" || { echo "Sin reporte PIT" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$xml" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ms = list(ET.parse(sys.argv[1]).getroot())
          killed = sum(1 for m in ms if m.get('status') in ('KILLED', 'TIMED_OUT'))
          print('### Mutation score PIT, capa de negocio (service, model, carrito)')
          print('| Mutantes | Muertos | Sobrevivientes | Mutation score | Umbral |')
          print('|---|---|---|---|---|')
          print(f'| {len(ms)} | {killed} | {len(ms) - killed} | {100 * killed / len(ms):.1f}% | 60% |')
          PY
      - name: Publicar evidencias del backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-evidence
          path: |
            proyecto/target/surefire-reports/
            proyecto/target/site/jacoco/
            proyecto/target/jacoco.exec
            proyecto/target/pit-reports/
            proyecto/target/StayHub.war
            proyecto/target/bom.json
            proyecto/target/bom.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: proyecto/ui-security
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proyecto/ui-security/package-lock.json
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Auditar dependencias npm
        run: npm audit --audit-level=moderate
      - name: Ejecutar pruebas del frontend
        run: |
          mkdir -p evidence
          npm test 2>&1 | tee evidence/frontend-tests.log
      - name: Construir estilos y validar el resultado
        run: |
          npm run build 2>&1 | tee evidence/frontend-build.log
          test -s ../src/main/webapp/assets/css/tailwind.css
      - name: Publicar evidencias del frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-evidence
          path: proyecto/ui-security/evidence/
          if-no-files-found: warn
          retention-days: 14

  pms-mock:
    name: Mock SOAP del PMS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar y empaquetar el simulador
        run: mvn --file pms-legado-mock/pom.xml --batch-mode --no-transfer-progress clean verify
      - name: Publicar simulador compilado
        uses: actions/upload-artifact@v7
        with:
          name: pms-mock
          path: pms-legado-mock/target/pms-legado-mock-*.jar
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Dependencias y SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Auditar dependencias con OSV
        run: |
          mkdir -p ci-evidence
          docker run --rm --volume "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --recursive --format=json \
            --output-file=/src/ci-evidence/osv-results.json /src
      - name: Publicar informes de seguridad
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence
          path: ci-evidence/osv-results.json
          if-no-files-found: warn
          retention-days: 14

  secrets-scan:
    name: Escaneo de secretos (historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Escanear todos los commits de todas las ramas con gitleaks
        run: |
          mkdir -p ci-evidence
          docker run --rm --volume "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --log-opts="--all" --redact --verbose \
            --report-format json --report-path /repo/ci-evidence/gitleaks-report.json
      - name: Escanear también el árbol de trabajo actual
        run: |
          docker run --rm --volume "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact --verbose \
            --report-format json --report-path /repo/ci-evidence/gitleaks-tree-report.json
      - name: Publicar reporte de secretos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secrets-evidence
          path: |
            ci-evidence/gitleaks-report.json
            ci-evidence/gitleaks-tree-report.json
          if-no-files-found: warn
          retention-days: 14

  integration-smoke:
    name: Integración Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validar Docker Compose
        run: docker compose config --quiet
      - name: Construir y levantar StayHub
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Cargar datos y probar REST, SOAP y mocks
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          docker compose exec -T app /opt/jboss/load-demo.sh | tee ci-evidence/demo-load.log
          curl --fail --silent --show-error http://localhost:9080/health | tee ci-evidence/ota-health.txt
          curl --fail --silent --show-error http://localhost:9091/PmsLegacyService?wsdl > ci-evidence/pms.wsdl
          curl --insecure --fail --silent --show-error https://localhost:8443/StayHub/api/hoteles > ci-evidence/hoteles.json
          jq -e 'type == "array" and length > 0' ci-evidence/hoteles.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright E2E
        working-directory: e2e
        run: npm ci
      - name: Ejecutar recorridos E2E aislando los límites de seguridad
        working-directory: e2e
        env:
          CI: "true"
          STAYHUB_BASE_URL: https://localhost:8443/StayHub
          STAYHUB_DOCKER_VERIFY: "true"
        run: |
          set -euo pipefail
          esperar_app() {
            for intento in $(seq 1 60); do
              if curl --insecure --fail --silent --output /dev/null \
                  https://localhost:8443/StayHub/index.html; then
                return 0
              fi
              sleep 2
            done
            echo "StayHub no volvió a estar disponible" >&2
            return 1
          }

          npx playwright test tests/stayhub-critical.spec.cjs
          docker compose --project-directory .. restart app
          esperar_app

          npx playwright test tests/session-security.spec.cjs
          docker compose --project-directory .. restart app
          esperar_app

          # Esta suite agota intencionalmente el límite de login, por eso va última.
          npx playwright test tests/live-security-matrix.spec.cjs
      - name: Guardar logs de los contenedores
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose logs --no-color > ci-evidence/compose.log
      - name: Publicar evidencias de integración
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar evidencias E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Apagar el entorno
        if: always()
        run: docker compose down --volumes --remove-orphans
